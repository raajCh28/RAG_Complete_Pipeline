  Questions should reflect how a real user might ask, not just repeat the wording of the document.
  Do not repeat the same intent.

  Return exactly:

  SUMMARY:
  <summary>

  QUESTIONS:
  <question 1>
  <question 2>
  <question 3>

  Do not add anything else.

