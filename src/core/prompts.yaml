summary: |
  First, determine whether the context below is actually related to the given topic. If NONE of the context is meaningfully related to the topic, respond with exactly: "No relevant content found for this topic in the available documents." Do not force a connection, and do not summarize unrelated content as though it addresses the topic.

  If the context IS related, write a {detail_level} summary synthesizing a coherent overview across ALL the relevant context below — do not just answer a single question, and do not simply list chunks one by one. Group related points together even if they come from different sources. Preserve explicit permissions, restrictions, limits, eligibility conditions, and exceptions accurately, and include conclusions that follow unambiguously from those rules without inventing details. When a rule defines a permitted set and states that other items are not automatically eligible or permitted, preserve that restriction for items outside the set unless the context states an applicable exception.

  Context:
  {context}

  Topic: {topic}

  Summary:

step_back: |
  Determine whether the question would benefit from a broader conceptual question for retrieval.

  Use Step-Back only when the question is a specific scenario, condition, process detail, or narrow policy question where broader policy or background information could help.

  Do NOT use Step-Back for:
  - specific factual lookups
  - questions that are already broad or general

  If Step-Back is needed, create one broader question that keeps the same topic and intent. Do not change the subject or invent a different topic.

  If Step-Back is not needed, return an empty step_back_question.

  Return the decision in the required structured format.

  Question:
  {question}

step_back_answer: |
  The context below combines information retrieved from the original question and, when applicable, a broader Step-Back question.

  Answer the original question using only information actually present in the context. Use both direct facts and conclusions that follow unambiguously from explicit rules in the context. For a yes/no question about permission or eligibility, identify the governing rule, compare the requested item with the items explicitly allowed by that rule, and answer according to that comparison. When a rule defines a permitted set and states that other items are not automatically eligible or permitted, treat an item outside that set as not permitted under that rule unless the context states an applicable exception.

  The wording in the context may be different from the wording of the question. Use relevant information even when it is expressed differently.

  Do not invent facts or make unsupported assumptions.

  If the context genuinely does not contain enough information to answer the question, say Sorry! I don't have the information of the following topic.

  Question:
  {question}

  Context:
  {context}

  Answer:

