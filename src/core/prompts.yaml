citation_answer: |
  Answer the question using only the numbered context blocks below.

  Write the final answer in clean prose without inserting citation markers in the middle of sentences.
  Use both direct facts and conclusions that follow unambiguously from explicit rules in the numbered context. For a yes/no question about permission or eligibility, identify the governing rule, compare the requested item with the items explicitly allowed by that rule, and answer according to that comparison. When a rule defines a permitted set and states that other items are not automatically eligible or permitted, treat an item outside that set as not permitted under that rule unless the context states an applicable exception. Support the conclusion with citations to the relevant numbered blocks.
  After the final sentence, add a single citation block at the end using the relevant reference numbers in square brackets, for example: [1][3][4].
  Only use reference numbers that actually appear below — never invent one.
  If the answer isn't in the context, say "Sorry! I don't have the information to answer that question" and cite nothing.

  Context:
  {context}

  Question: {question}

  Answer:

router: |
  Classify the following question into exactly ONE of these categories:

  qa - a specific fact-lookup question answerable by finding one or a few relevant passages. This includes questions about a specific process, policy rule, requirement, procedure, condition, fact, or a single employee/entity record. A request about one employee, person, record, or case remains qa even if it says "summarize" or "overview" when it is still about one specific entity.

  summarize - a request for a broad overview, synthesis, or general understanding across several documents or sections. Use summarize when the user asks for a brief overview, summary, high-level explanation, policy outline, or general understanding of a topic. Use it for policies, procedures, or subject-level explanations that span a wider body of content, not for a single employee/person record or one narrow fact lookup.

  unsupported - a question that requires counting, aggregation, comparison across many records, or structured calculations that this text-only RAG system cannot reliably do. Examples: "How many employees earn less than X", "What is the average salary", "How many employees are in the Cloud team".

  Classification rules:
  1. Use qa for focused factual questions, even when the answer has multiple steps or points.
  2. Use qa for a single person, employee, record, case, or entity, even if the wording includes "summarize", "overview", or "brief detail".
  3. Use summarize for broad, high-level, or overview-style requests about a policy, process, or topic across multiple sections/documents, such as "brief detail of the leave policy", "overview of the security policy", "summarize the hiring policy", or "give me an overview of X".
  4. Use summarize for general policy explanations, not just explicit "summarize" wording.
  5. Use unsupported only for exact counting, aggregation, or computation across many records or structured datasets.
  6. Do not classify a question as unsupported just because the answer might not be present in the documents.
  7. Respond with ONLY one word: qa, summarize, or unsupported.

  Question: {question}

agentic_system: |
  You answer questions by using the search_documents tool to look up relevant information from the company's documents. You must use the tool at least once before answering any question — never answer directly from your own general knowledge, even if you think you know the answer. You may call the tool more than once, with different queries, if a single search does not cover everything the question is asking. Once you have enough information, respond with your final answer directly. If the documents do not contain relevant information for this question, say so honestly rather than guessing or using outside knowledge. Use both direct facts and conclusions that follow unambiguously from explicit rules in the retrieved documents. For permission or eligibility questions, apply the governing rule to the requested item, including stated limits and exceptions.

agentic_forced_final: |
  Stopping further search ({reason}). Based only on what was actually found above, give your best final answer now. If the information found does not answer the question, say so honestly instead of guessing. Apply explicit rules and their stated limits or exceptions to the requested item when the retrieved information logically entails an answer.

rerank_score: |
  You are a document relevance evaluator.

  Your task is to determine how relevant the following document
  chunk is to the user's question.

  Give a relevance score from 0 to 10:

  10 = Directly and completely answers the question
  8-9 = Highly relevant and contains most of the required information
  6-7 = Relevant but only partially answers the question
  4-5 = Somewhat related but does not answer the question well
  2-3 = Weakly related
  0-1 = Not relevant

  IMPORTANT:
  - Judge relevance to the question, not writing quality.
  - Do not use information outside the provided chunk.
  - Return ONLY the numeric score.
  - Do not provide an explanation.

  User Question:
  {question}

  Document Chunk:
  {document}

  Relevance Score:

