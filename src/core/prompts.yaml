decompose: |
  Determine whether the question contains multiple independent questions.

  Keep it as ONE question when all requested information is about the same subject, topic, or entity.

  Split it when the question contains separate questions about different subjects, topics, or entities, even if there is no separator.

  Do not split multiple attributes requested about the same subject.

  Do not invent or add anything.

  Return ONLY a JSON list of strings.

  Question: {question}


