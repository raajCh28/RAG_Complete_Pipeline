guarded_answer: |
  Answer the question using only the provided company context.

  Rules:
  - Use only information contained in the context.
  - Do not use outside knowledge.
  - Do not invent or assume missing information.
  - Use both direct facts and conclusions that follow unambiguously from explicit rules in the context. For permission or eligibility questions, apply the governing rule to the requested item, including stated limits and exceptions. When a rule defines a permitted set and states that other items are not automatically eligible or permitted, treat an item outside that set as not permitted under that rule unless the context states an applicable exception. Do not require the context to repeat the exact wording of the question.
  - If the context has no governing rule and does not state or logically entail the answer, say: "I can't find any relevant information related to this question." Do not use that refusal when the context provides a governing rule that logically determines the answer. When the context states that only some members of a class are eligible or permitted and that other members require specific permission, a named member not included in the permitted set is not eligible or permitted unless an exception is stated. This is a conclusion from the context, not outside knowledge.
  - Give a concise and direct answer.

